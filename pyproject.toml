[build-system]
requires = ["setuptools>=61"]
build-backend = "setuptools.build_meta"

[project]
name = "tidymate"
version = "1.0.0"
description = "Python file organizer: sort your Downloads folder by type, bulk rename, find duplicates, archive old files and undo anything. Safe preview, no dependencies."
readme = "README.md"
requires-python = ">=3.8"
license = {text = "MIT"}
authors = [{name = "MrPerfect"}]
keywords = [
    "file organizer", "organize files", "downloads folder", "file management",
    "folder organizer", "bulk rename", "duplicate file finder", "cleanup",
    "file sorter", "backup", "undo", "cli", "tidymate",
]
classifiers = [
    "Development Status :: 4 - Beta",
    "Environment :: Console",
    "Intended Audience :: End Users/Desktop",
    "License :: OSI Approved :: MIT License",
    "Operating System :: OS Independent",
    "Programming Language :: Python :: 3",
    "Programming Language :: Python :: 3 :: Only",
    "Programming Language :: Python :: 3.8",
    "Programming Language :: Python :: 3.9",
    "Programming Language :: Python :: 3.10",
    "Programming Language :: Python :: 3.11",
    "Programming Language :: Python :: 3.12",
    "Topic :: Desktop Environment :: File Managers",
    "Topic :: System :: Filesystems",
    "Topic :: Utilities",
]
dependencies = []

[project.scripts]
tidymate = "tidymate.cli:main"
start_here = "tidymate.cli:main"

[project.urls]
Homepage = "https://github.com/Anand2k29/TidyMate"
Documentation = "https://github.com/Anand2k29/TidyMate#readme"
Issues = "https://github.com/Anand2k29/TidyMate/issues"
Changelog = "https://github.com/Anand2k29/TidyMate/releases"

[tool.setuptools.packages.find]
include = ["tidymate*"]

[tool.setuptools.package-data]
tidymate = ["*.json"]