[build-system]
requires = ["setuptools>=61"]
build-backend = "setuptools.build_meta"

[project]
name = "tidymate"
version = "1.0.0"
description = "Tidy, rename, archive, back up and check your files safely - with preview, undo and plain-English explanations."
readme = "README.md"
requires-python = ">=3.8"
license = {text = "MIT"}
keywords = ["tidymate", "file organizer", "downloads", "cleanup", "rename", "duplicates", "backup", "undo"]
classifiers = [
    "Programming Language :: Python :: 3",
    "License :: OSI Approved :: MIT License",
    "Operating System :: OS Independent",
    "Environment :: Console",
    "Topic :: Utilities",
]
dependencies = []

[project.scripts]
tidymate = "tidymate.cli:main"
start_here = "tidymate.cli:main"

[project.urls]
Homepage = "https://github.com/YOUR-GITHUB-USER/tidymate"
Issues = "https://github.com/YOUR-GITHUB-USER/tidymate/issues"

[tool.setuptools]
packages = ["tidymate"]
